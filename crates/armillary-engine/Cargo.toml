[package]
name = "armillary-engine"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Read-only files service for a composed armillary workspace. The loopless skeleton the loop later attaches to."

[dependencies]
armillary-composition = { path = "../armillary-composition" }
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
uuid = { version = "1", features = ["v4"] }
humantime = "2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["test-util"] }
